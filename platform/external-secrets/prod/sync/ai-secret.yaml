apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-runtime
  namespace: backend

spec:
  refreshInterval: 1m0s

  secretStoreRef:
    name: needu-prod-ssm
    kind: SecretStore

  target:
    name: ai-runtime
    creationPolicy: Owner

  data:
    # Service
    - secretKey: SERVICE_TOKEN
      remoteRef:
        key: /needu/v2/prod/ai/SERVICE_TOKEN

    # Database
    - secretKey: CATALOG_DATABASE_URL_RO
      remoteRef:
        key: /needu/v2/prod/ai/CATALOG_DATABASE_URL_RO

    # API Keys
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: /needu/v2/prod/ai/OPENROUTER_API_KEY

    - secretKey: MODEL_API_KEY
      remoteRef:
        key: /needu/v2/prod/ai/MODEL_API_KEY

    - secretKey: RUNPOD_API_KEY
      remoteRef:
        key: /needu/v2/prod/ai/RUNPOD_API_KEY

    - secretKey: UPSTAGE_API_KEY
      remoteRef:
        key: /needu/v2/prod/ai/UPSTAGE_API_KEY

    # Response Model
    - secretKey: RESPONSE_MODEL_BASE_URL
      remoteRef:
        key: /needu/v2/prod/ai/RESPONSE_MODEL_BASE_URL

    - secretKey: RESPONSE_MODEL_NAME
      remoteRef:
        key: /needu/v2/prod/ai/RESPONSE_MODEL_NAME

    # Response Fallback Model
    - secretKey: RESPONSE_FALLBACK_MODEL_BASE_URL
      remoteRef:
        key: /needu/v2/prod/ai/RESPONSE_FALLBACK_MODEL_BASE_URL

    - secretKey: RESPONSE_FALLBACK_MODEL_NAME
      remoteRef:
        key: /needu/v2/prod/ai/RESPONSE_FALLBACK_MODEL_NAME

    # Extraction Model
    - secretKey: EXTRACTION_MODEL_BASE_URL
      remoteRef:
        key: /needu/v2/prod/ai/EXTRACTION_MODEL_BASE_URL

    - secretKey: EXTRACTION_MODEL_NAME
      remoteRef:
        key: /needu/v2/prod/ai/EXTRACTION_MODEL_NAME

    # Extraction Fallback Model
    - secretKey: EXTRACTION_FALLBACK_MODEL_BASE_URL
      remoteRef:
        key: /needu/v2/prod/ai/EXTRACTION_FALLBACK_MODEL_BASE_URL

    - secretKey: EXTRACTION_FALLBACK_MODEL_NAME
      remoteRef:
        key: /needu/v2/prod/ai/EXTRACTION_FALLBACK_MODEL_NAME

    # Judgment Model
    - secretKey: JUDGMENT_MODEL_BASE_URL
      remoteRef:
        key: /needu/v2/prod/ai/JUDGMENT_MODEL_BASE_URL

    - secretKey: JUDGMENT_MODEL_NAME
      remoteRef:
        key: /needu/v2/prod/ai/JUDGMENT_MODEL_NAME

    # RunPod
    - secretKey: RUNPOD_POD_NAME_PREFIX
      remoteRef:
        key: /needu/v2/prod/ai/RUNPOD_POD_NAME_PREFIX

    # K1 Fault Injection
    - secretKey: FAULT_INJECTION_ENABLED
      remoteRef:
        key: /needu/v3/prod/ai/FAULT_INJECTION_ENABLED
