apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-api-runtime
  namespace: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: needu-prod-ssm
    kind: SecretStore
  target:
    name: ai-api-runtime
    creationPolicy: Owner
  data:
    - secretKey: AI_SERVICE_TOKEN
      remoteRef:
        key: /needu/v2/prod/backend/AI_SERVICE_TOKEN

    - secretKey: AI_CHAT_SHORT_COOLDOWN_EXTERNAL_IDS
      remoteRef:
        key: /needu/v2/prod/backend/AI_CHAT_SHORT_COOLDOWN_EXTERNAL_IDS
