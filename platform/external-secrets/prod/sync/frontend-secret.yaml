apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-runtime
  namespace: frontend
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: needu-prod-ssm
    kind: SecretStore
  target:
    name: frontend-runtime
    creationPolicy: Owner
  data:
    - secretKey: SENTRY_ENVIRONMENT
      remoteRef:
        key: /needu/v2/prod/frontend-runtime/SENTRY_ENVIRONMENT
