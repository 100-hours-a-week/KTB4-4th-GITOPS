    - secretKey: AUTH_DEMOLOGIN_ACCOUNTS_2_USERID
      remoteRef:
        key: /needu/v3/prod/backend/AUTH_DEMOLOGIN_ACCOUNTS_2_USERID

    - secretKey: AUTH_DEMOLOGIN_ACCOUNTS_3_LOGINID
      remoteRef:
        key: /needu/v3/prod/backend/AUTH_DEMOLOGIN_ACCOUNTS_3_LOGINID

    - secretKey: AUTH_DEMOLOGIN_ACCOUNTS_3_PASSWORDHASH
      remoteRef:
        key: /needu/v3/prod/backend/AUTH_DEMOLOGIN_ACCOUNTS_3_PASSWORDHASH

    - secretKey: AUTH_DEMOLOGIN_ACCOUNTS_3_USERID
      remoteRef:
