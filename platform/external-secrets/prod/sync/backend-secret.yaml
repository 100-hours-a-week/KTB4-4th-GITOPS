apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-runtime
  namespace: backend
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    name: needu-prod-ssm
    kind: SecretStore
  target:
    name: backend-runtime
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: /needu/v2/prod/backend/JWT_SECRET

    - secretKey: KAKAO_REST_API_KEY
      remoteRef:
        key: /needu/v2/prod/backend/KAKAO_REST_API_KEY

    - secretKey: KAKAO_CLIENT_SECRET
      remoteRef:
        key: /needu/v2/prod/backend/KAKAO_CLIENT_SECRET

    - secretKey: KAKAO_ADMIN_KEY
      remoteRef:
        key: /needu/v2/prod/backend/KAKAO_ADMIN_KEY

    - secretKey: KAKAO_TOKEN_ENCRYPTION_KEY
      remoteRef:
        key: /needu/v2/prod/backend/KAKAO_TOKEN_ENCRYPTION_KEY

    - secretKey: KAKAO_REDIRECT_URI
      remoteRef:
        key: /needu/v3/prod/backend/KAKAO_REDIRECT_URI

    - secretKey: KAKAO_FRIEND_REDIRECT_URI
      remoteRef:
        key: /needu/v3/prod/backend/KAKAO_FRIEND_REDIRECT_URI

    - secretKey: DEMO_LOGIN_ENABLED
      remoteRef:
        key: /needu/v3/prod/backend/DEMO_LOGIN_ENABLED

    - secretKey: AUTH_DEMOLOGIN_ACCOUNTS_0_LOGINID
      remoteRef:
        key: /needu/v3/prod/backend/AUTH_DEMOLOGIN_ACCOUNTS_0_LOGINID

    - secretKey: AUTH_DEMOLOGIN_ACCOUNTS_0_PASSWORDHASH
      remoteRef:
        key: /needu/v3/prod/backend/AUTH_DEMOLOGIN_ACCOUNTS_0_PASSWORDHASH

    - secretKey: AUTH_DEMOLOGIN_ACCOUNTS_0_USERID
      remoteRef:
        key: /needu/v3/prod/backend/AUTH_DEMOLOGIN_ACCOUNTS_0_USERID

    - secretKey: AUTH_DEMOLOGIN_ACCOUNTS_1_LOGINID
      remoteRef:
        key: /needu/v3/prod/backend/AUTH_DEMOLOGIN_ACCOUNTS_1_LOGINID

    - secretKey: AUTH_DEMOLOGIN_ACCOUNTS_1_PASSWORDHASH
      remoteRef:
        key: /needu/v3/prod/backend/AUTH_DEMOLOGIN_ACCOUNTS_1_PASSWORDHASH

    - secretKey: AUTH_DEMOLOGIN_ACCOUNTS_1_USERID
      remoteRef:
        key: /needu/v3/prod/backend/AUTH_DEMOLOGIN_ACCOUNTS_1_USERID

    - secretKey: AUTH_DEMOLOGIN_ACCOUNTS_2_LOGINID
      remoteRef:
