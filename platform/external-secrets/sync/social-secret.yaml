apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: social-runtime
  namespace: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: needu-dev-ssm
    kind: SecretStore
  target:
    name: social-runtime
    creationPolicy: Owner
  data:
    - secretKey: WEB_PUSH_ENABLED
      remoteRef:
        key: /needu/v2/dev/backend/WEB_PUSH_ENABLED

    - secretKey: VAPID_PUBLIC_KEY
      remoteRef:
        key: /needu/v2/dev/backend/VAPID_PUBLIC_KEY

    - secretKey: VAPID_PRIVATE_KEY
      remoteRef:
        key: /needu/v2/dev/backend/VAPID_PRIVATE_KEY

    - secretKey: VAPID_SUBJECT
      remoteRef:
        key: /needu/v2/dev/backend/VAPID_SUBJECT

    - secretKey: WEB_PUSH_TTL
      remoteRef:
        key: /needu/v2/dev/backend/WEB_PUSH_TTL

    - secretKey: WEB_PUSH_REQUEST_TIMEOUT
      remoteRef:
        key: /needu/v2/dev/backend/WEB_PUSH_REQUEST_TIMEOUT
