apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-runtime
  namespace: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: needu-dev-ssm
    kind: SecretStore
  target:
    name: ai-runtime
    creationPolicy: Owner
  data:
    - secretKey: SERVICE_TOKEN
      remoteRef:
        key: /needu/v2/dev/ai/SERVICE_TOKEN
    - secretKey: CATALOG_DATABASE_URL_RO
      remoteRef:
        key: /needu/v2/dev/ai/CATALOG_DATABASE_URL_RO
