apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-runtime
  namespace: backend
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: needu-dev-ssm
    kind: SecretStore
  target:
    name: ai-runtime
    creationPolicy: Owner
  data:
    # 기존 설정
    - secretKey: SERVICE_TOKEN
      remoteRef:
        key: /needu/v2/dev/ai/SERVICE_TOKEN

    - secretKey: CATALOG_DATABASE_URL_RO
      remoteRef:
        key: /needu/v2/dev/ai/CATALOG_DATABASE_URL_RO

    # OpenRouter API Key
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: /needu/v2/dev/ai/OPENROUTER_API_KEY

    # Response 모델 설정
    - secretKey: RESPONSE_MODEL_BASE_URL
      remoteRef:
        key: /needu/v2/dev/ai/RESPONSE_MODEL_BASE_URL

    - secretKey: RESPONSE_MODEL_NAME
      remoteRef:
        key: /needu/v2/dev/ai/RESPONSE_MODEL_NAME

    # Response Fallback 모델 설정
    - secretKey: RESPONSE_FALLBACK_MODEL_BASE_URL
      remoteRef:
        key: /needu/v2/dev/ai/RESPONSE_FALLBACK_MODEL_BASE_URL

    - secretKey: RESPONSE_FALLBACK_MODEL_NAME
      remoteRef:
        key: /needu/v2/dev/ai/RESPONSE_FALLBACK_MODEL_NAME

    - secretKey: MODEL_API_KEY
      remoteRef:
        key: /needu/v2/dev/ai/MODEL_API_KEY

    # Extraction 모델 설정
    - secretKey: EXTRACTION_MODEL_BASE_URL
      remoteRef:
        key: /needu/v2/dev/ai/EXTRACTION_MODEL_BASE_URL

    - secretKey: EXTRACTION_MODEL_NAME
      remoteRef:
        key: /needu/v2/dev/ai/EXTRACTION_MODEL_NAME
