apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-runtime
  namespace: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: needu-dev-ssm
    kind: SecretStore
  target:
    name: backend-runtime
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: /needu/v2/dev/backend/JWT_SECRET
    - secretKey: AI_SERVICE_TOKEN
      remoteRef:
        key: /needu/v2/dev/backend/AI_SERVICE_TOKEN
    - secretKey: KAKAO_REDIRECT_URI
      remoteRef:
        key: /needu/v3/dev/backend/KAKAO_REDIRECT_URI
    - secretKey: KAKAO_FRIEND_REDIRECT_URI
      remoteRef:
        key: /needu/v3/dev/backend/KAKAO_FRIEND_REDIRECT_URI
