apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: needu-prod-adot-collector
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - services
      - endpoints
      - pods
      - namespaces
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: needu-prod-adot-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: needu-prod-adot-collector
subjects:
  - kind: ServiceAccount
    name: adot-collector
    namespace: monitoring
