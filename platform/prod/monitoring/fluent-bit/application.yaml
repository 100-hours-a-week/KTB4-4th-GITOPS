apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: needu-prod-fluent-bit
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-4th-GITOPS.git
    targetRevision: main
    path: platform/prod/monitoring/fluent-bit
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
