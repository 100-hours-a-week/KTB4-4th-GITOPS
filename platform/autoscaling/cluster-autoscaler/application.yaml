apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: needu-dev-cluster-autoscaler
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/autoscaler
    chart: cluster-autoscaler
    targetRevision: 9.60.0
    helm:
      releaseName: cluster-autoscaler
      values: |
        image:
          tag: v1.36.0

        cloudProvider: aws
        awsRegion: ap-northeast-2

        autoDiscovery:
          clusterName: needu-v3-dev
          tags:
            - k8s.io/cluster-autoscaler/enabled
            - k8s.io/cluster-autoscaler/needu-v3-dev

        rbac:
          create: true
          serviceAccount:
            create: true
            name: cluster-autoscaler

        nodeSelector:
          pool: system

        tolerations:
          - key: dedicated
            operator: Equal
            value: system
            effect: NoSchedule

        extraArgs:
          balance-similar-node-groups: true
          expander: least-waste
          max-node-provision-time: 15m
          scale-down-delay-after-add: 10m
          scale-down-unneeded-time: 10m
          skip-nodes-with-system-pods: true

        resources:
          requests:
            cpu: 100m
            memory: 300Mi
          limits:
            cpu: 300m
            memory: 600Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
