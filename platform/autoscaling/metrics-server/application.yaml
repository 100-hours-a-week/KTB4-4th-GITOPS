apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: needu-dev-metrics-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.14.0
    helm:
      releaseName: metrics-server
      values: |
        replicas: 1

        nodeSelector:
          pool: system

        tolerations:
          - key: dedicated
            operator: Equal
            value: system
            effect: NoSchedule

        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 300m
            memory: 400Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
