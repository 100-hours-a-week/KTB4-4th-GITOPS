apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: needu-dev-adot-collector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-4th-GITOPS.git
    targetRevision: main
    path: platform/monitoring/adot
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
