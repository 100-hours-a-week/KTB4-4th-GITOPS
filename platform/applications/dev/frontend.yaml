apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: needu-dev-frontend
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/100-hours-a-week/KTB4-4th-GITOPS.git
      targetRevision: main
      path: charts/application
      helm:
        releaseName: frontend
        valueFiles:
          - $values/environments/dev/frontend.yaml
    - repoURL: https://github.com/100-hours-a-week/KTB4-4th-GITOPS.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
