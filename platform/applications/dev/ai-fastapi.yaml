apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: needu-dev-ai-fastapi
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/100-hours-a-week/KTB4-4th-GITOPS.git
      targetRevision: main
      path: charts/application
      helm:
        releaseName: ai-fastapi
        valueFiles:
          - $values/environments/dev/ai-fastapi.yaml
    - repoURL: https://github.com/100-hours-a-week/KTB4-4th-GITOPS.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
