# Dev 전용 초기 안전장치입니다. 실제 Pod Requests와 Node Allocatable 확인 후 조정합니다.
apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
  namespace: frontend
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      default:
        cpu: "1"
        memory: 2Gi
      min:
        cpu: 50m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 4Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workload-budget
  namespace: frontend
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    pods: "4"
    services: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
  namespace: backend
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      default:
        cpu: "1"
        memory: 2Gi
      min:
        cpu: 50m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 4Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workload-budget
  namespace: backend
spec:
  hard:
    requests.cpu: 2500m
    requests.memory: 8Gi
    pods: "10"
    services: "12"
