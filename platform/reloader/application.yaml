apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: needu-dev-reloader
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: 2.2.18
    helm:
      releaseName: reloader
      values: |
        reloader:
          reloadStrategy: annotations
          watchGlobally: false
          namespaces:
            - frontend
            - backend
          deployment:
            nodeSelector:
              pool: system
            tolerations:
              - key: dedicated
                operator: Equal
                value: system
                effect: NoSchedule
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
