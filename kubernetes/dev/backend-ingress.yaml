apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: needu-dev-backend-ingress
  namespace: backend
  annotations:
    alb.ingress.kubernetes.io/group.name: needu-v3-dev
    alb.ingress.kubernetes.io/group.order: "1"
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - host: v3.dev.needu.gift
      http:
        paths:
          # Auth API
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-api
                port:
                  number: 8080

          - path: /api/v1/guidance
            pathType: Exact
            backend:
              service:
                name: auth-api
                port:
                  number: 8080

          - path: /api/v1/users/me
            pathType: Exact
            backend:
              service:
                name: auth-api
                port:
                  number: 8080

          - path: /api/v1/users/me/consents
            pathType: Prefix
            backend:
              service:
                name: auth-api
                port:
                  number: 8080

          # Recommendation API
          - path: /api/v1/products
            pathType: Prefix
            backend:
              service:
                name: recommendation-api
                port:
                  number: 8080

          - path: /api/v1/users/me/personal-recommendations
            pathType: Prefix
            backend:
              service:
                name: recommendation-api
                port:
                  number: 8080

          - path: /api/v1/users/me/gift-preferences
            pathType: Prefix
            backend:
              service:
                name: recommendation-api
                port:
                  number: 8080

          # Social API
          - path: /api/v1/friends
            pathType: Prefix
            backend:
              service:
                name: social-api
                port:
                  number: 8080

          - path: /api/v1/users/me/settings/notifications
            pathType: Prefix
            backend:
              service:
                name: social-api
                port:
                  number: 8080
