apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: needu-dev-backend-ingress
  namespace: backend
  annotations:
    alb.ingress.kubernetes.io/group.name: needu-v3-dev
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
spec:
  ingressClassName: alb
  rules:
    - host: v3.dev.needu.gift
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-api
                port:
                  number: 8080
