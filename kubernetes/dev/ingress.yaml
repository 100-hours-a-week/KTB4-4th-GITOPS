apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: needu-dev-ingress
  namespace: frontend
  annotations:
    alb.ingress.kubernetes.io/group.name: needu-v3-dev
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/load-balancer-name: needu-v3-dev-group
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/subnets: subnet-09862cdd62336beb2,subnet-0b86dc8e5871c497c
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Omit certificate-arn intentionally: the controller discovers ACM certificates from Ingress host rules.
    alb.ingress.kubernetes.io/healthcheck-path: /login
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - host: v3.dev.needu.gift
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: dev.needu.gift
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
