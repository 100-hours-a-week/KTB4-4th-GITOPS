apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: needu-prod-ingress
  namespace: frontend
  annotations:
    alb.ingress.kubernetes.io/group.name: needu-v3-prod
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/load-balancer-name: needu-v3-prod-group
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/subnets: subnet-05ebd035963ad66d9,subnet-00ab31f7fb6619a36,subnet-0258a53c491aa8964
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:919551759796:certificate/11fde9c7-b865-46cb-a58f-b43f0dd82728
    alb.ingress.kubernetes.io/healthcheck-path: /login
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - host: v3.prod.needu.gift
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
