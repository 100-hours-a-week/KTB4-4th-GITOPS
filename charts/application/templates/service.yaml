{{- if and .Values.enabled .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "needu.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "needu.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "needu.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
