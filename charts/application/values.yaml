enabled: false

nameOverride: ""
namespace: ""

image:
  repository: ""
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1
progressDeadlineSeconds: null
terminationGracePeriodSeconds: null
preStopSleepSeconds: null
deploymentAnnotations: {}
podAnnotations: {}

serviceAccount:
  create: false
  name: ""

service:
  enabled: true
  port: 8080
  targetPort: 8080

containerPort: 8080
resources: {}

probes:
  startup:
    enabled: false
    path: /livez
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 30
  liveness:
    enabled: false
    path: /livez
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    enabled: false
    path: /readyz
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 60
  behavior: {}

keda:
  enabled: false
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 2
  fallback: {}
  advanced: {}
  triggers: []

env: []
extraEnv: []
envFrom: []
nodeSelector: {}
tolerations: []
topologySpreadConstraints: []
