progressDeadlineSeconds: 300
terminationGracePeriodSeconds: 130
preStopSleepSeconds: 10
enabled: true
nameOverride: ai-fastapi
namespace: backend
nodeSelector:
  pool: application
deploymentAnnotations:
  secret.reloader.stakater.com/auto: "true"
serviceAccount:
  name: ai-fastapi
image:
  repository: "919551759796.dkr.ecr.ap-northeast-2.amazonaws.com/need-u/ai"
  digest: "sha256:2e5474e63d4192e6ae27768fb5a819a96c334d3f73ff8d875778606e2cdfbab9"
  tag: "v2-b649d594be354a40c509ade5e83d37c63cd7a7b4"
env:
  - name: APP_ENV
    value: development
  - name: UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN
    value: "120"
  # V3 Valkey Cache
  - name: REDIS_URL
    value: rediss://master.needu-v3-dev-valkey-a.s4gucc.apn2.cache.amazonaws.com:6379/0
envFrom:
  - secretRef:
      name: ai-runtime
service:
  enabled: true
  port: 8000
  targetPort: 8000
containerPort: 8000
probes:
  startup:
    enabled: true
    path: /health
  liveness:
    enabled: true
    path: /health
  readiness:
    enabled: true
    path: /health
