progressDeadlineSeconds: 300
terminationGracePeriodSeconds: 130
preStopSleepSeconds: 10
enabled: true
nameOverride: ai-fastapi
namespace: backend
nodeSelector:
  pool: application
deploymentAnnotations:
  secret.reloader.stakater.com/auto: "true"
serviceAccount:
  name: ai-fastapi
image:
  repository: "919551759796.dkr.ecr.ap-northeast-2.amazonaws.com/need-u/ai"
  digest: "sha256:76875d0e8723c9feead1b6189e9709d380f71cd9b9297618fba8127c806eb259"
  tag: "v2-aa128855e95e33ce1c2636fd696bfffdb8036716"
env:
  - name: APP_ENV
    value: development
  - name: UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN
    value: "120"
  # V3 Valkey Cache
  - name: REDIS_URL
    value: rediss://master.needu-v3-dev-valkey-a.s4gucc.apn2.cache.amazonaws.com:6379/0
envFrom:
  - secretRef:
      name: ai-runtime
service:
  enabled: true
  port: 8000
  targetPort: 8000
containerPort: 8000
probes:
  startup:
    enabled: true
    path: /health
  liveness:
    enabled: true
    path: /health
  readiness:
    enabled: true
    path: /health
