progressDeadlineSeconds: 300
terminationGracePeriodSeconds: 130
preStopSleepSeconds: 10
enabled: true
nameOverride: ai-fastapi
namespace: backend
nodeSelector:
  pool: application
deploymentAnnotations:
  secret.reloader.stakater.com/auto: "true"
serviceAccount:
  name: ai-fastapi
image:
  repository: "919551759796.dkr.ecr.ap-northeast-2.amazonaws.com/need-u/ai"
  digest: "sha256:44918dc32d6baca76934e964315bbab2dcbe4c312b7e3defe11969d31e97b9cd"
  tag: "v2-3ccbcce57212d986e3216e77590561783c1315ee"
env:
  - name: APP_ENV
    value: development
  - name: UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN
    value: "120"
  # V3 Valkey Cache
  - name: REDIS_URL
    value: rediss://master.needu-v3-dev-valkey-a.s4gucc.apn2.cache.amazonaws.com:6379/0
envFrom:
  - secretRef:
      name: ai-runtime
service:
  enabled: true
  port: 8000
  targetPort: 8000
containerPort: 8000
probes:
  startup:
    enabled: true
    path: /health
  liveness:
    enabled: true
    path: /health
  readiness:
    enabled: true
    path: /health
