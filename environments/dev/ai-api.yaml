progressDeadlineSeconds: 300
terminationGracePeriodSeconds: 130
preStopSleepSeconds: 10
enabled: true
nameOverride: ai-api
namespace: backend
nodeSelector:
  pool: application
serviceAccount:
  name: ai-api
extraEnv:
  - name: SERVER_SHUTDOWN
    value: graceful
  - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
    value: 120s
envFrom:
  - secretRef:
      name: backend-runtime
  - secretRef:
      name: backend-db
  - secretRef:
      name: ai-api-runtime
service:
  enabled: true
  port: 8080
probes:
  startup:
    enabled: true
    path: /livez
  liveness:
    enabled: true
    path: /livez
  readiness:
    enabled: true
    path: /readyz
