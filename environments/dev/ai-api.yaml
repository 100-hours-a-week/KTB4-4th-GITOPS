progressDeadlineSeconds: 300
terminationGracePeriodSeconds: 130
preStopSleepSeconds: 10
enabled: true
nameOverride: ai-api
namespace: backend
nodeSelector:
  pool: application
serviceAccount:
  name: ai-api
extraEnv:
  - name: SERVER_SHUTDOWN
    value: graceful
  - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
    value: 120s
  - name: STREAM_REDIS_HOST
    value: master.needu-v3-dev-valkey.s4gucc.apn2.cache.amazonaws.com
  - name: STREAM_REDIS_PORT
    value: "6379"
  - name: STREAM_REDIS_SSL_ENABLED
    value: "true"
  - name: STREAM_REDIS_CONNECT_TIMEOUT
    value: "10s"
  - name: STREAM_REDIS_TIMEOUT
    value: "10s"
  - name: AI_CHAT_REPLY_QUEUE_ENABLED
    value: "true"
  - name: AI_CHAT_REPLY_WORKER_ENABLED
    value: "false"
envFrom:
  - secretRef:
      name: backend-runtime
  - secretRef:
      name: backend-db
  - secretRef:
      name: ai-api-runtime
service:
  enabled: true
  port: 8080
probes:
  startup:
    enabled: true
    path: /livez
  liveness:
    enabled: true
    path: /livez
  readiness:
    enabled: true
    path: /readyz
