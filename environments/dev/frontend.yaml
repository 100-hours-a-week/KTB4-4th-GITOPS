progressDeadlineSeconds: 300
enabled: true
nameOverride: frontend
namespace: frontend
nodeSelector:
  pool: application
deploymentAnnotations:
  secret.reloader.stakater.com/auto: "true"
serviceAccount:
  name: frontend
image:
  repository: "919551759796.dkr.ecr.ap-northeast-2.amazonaws.com/need-u/frontend"
  digest: "sha256:00f16e4e9bd27f51debe1fcdcf07e0aa052e178e8a8cd0cbc60d704118fd9639"
  tag: "v2-1d8bb8c4994982f3f416d1e844a2435a0e252f3f"
env:
  - name: NODE_ENV
    value: production
  - name: BACKEND_API_BASE_URL
    value: https://v3.dev.needu.gift/api
  - name: BACKEND_AUTH_API_BASE_URL
    value: "http://auth-api.backend.svc.cluster.local:8080/"
  - name: BACKEND_RECOMMENDATION_API_BASE_URL
    value: "http://recommendation-api.backend.svc.cluster.local:8080/"
  - name: BACKEND_SOCIAL_API_BASE_URL
    value: "http://social-api.backend.svc.cluster.local:8080/"
envFrom:
  - secretRef:
      name: frontend-runtime
service:
  enabled: true
  port: 3000
  targetPort: 3000
containerPort: 3000
probes:
  liveness:
    enabled: true
    path: /api/health/live
  readiness:
    enabled: true
    path: /api/health/ready
