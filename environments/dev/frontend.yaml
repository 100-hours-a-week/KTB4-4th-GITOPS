enabled: false
nameOverride: frontend
namespace: frontend
nodeSelector:
  pool: application
serviceAccount:
  name: frontend
image:
  repository: "919551759796.dkr.ecr.ap-northeast-2.amazonaws.com/need-u/frontend"
  digest: ""
  tag: "9d4001cb8698203eb781bf493d6eca8c7008d722"
env:
  - name: NODE_ENV
    value: production
  - name: BACKEND_API_BASE_URL
    value: https://v3.dev.needu.gift/api
envFrom:
  - secretRef:
      name: frontend-runtime
service:
  enabled: true
  port: 3000
  targetPort: 3000
containerPort: 3000
probes:
  liveness:
    enabled: false
    path: /api/health/live
  readiness:
    enabled: false
    path: /api/health/ready
