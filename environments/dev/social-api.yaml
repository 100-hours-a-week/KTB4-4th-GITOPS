enabled: true
nameOverride: social-api
namespace: backend
nodeSelector:
  pool: application
serviceAccount:
  name: backend-api
envFrom:
  - secretRef:
      name: backend-runtime
  - secretRef:
      name: backend-db
service:
  enabled: true
  port: 8080
probes:
  startup:
    enabled: false
    path: /livez
  liveness:
    enabled: false
    path: /livez
  readiness:
    enabled: false
    path: /readyz
