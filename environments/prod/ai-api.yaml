progressDeadlineSeconds: 300
enabled: true
nameOverride: ai-api
namespace: backend
nodeSelector:
  pool: application
serviceAccount:
  name: ai-api
envFrom:
  - secretRef:
      name: backend-runtime
  - secretRef:
      name: backend-db
  - secretRef:
      name: ai-api-runtime
service:
  enabled: true
  port: 8080
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
probes:
  startup:
    enabled: true
    path: /livez
  liveness:
    enabled: true
    path: /livez
  readiness:
    enabled: true
    path: /readyz
