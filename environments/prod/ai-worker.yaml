progressDeadlineSeconds: 300
terminationGracePeriodSeconds: 130
preStopSleepSeconds: 10
enabled: true
nameOverride: ai-worker
namespace: backend
replicaCount: 1
nodeSelector:
  pool: application
serviceAccount:
  create: true
  name: ai-worker
deploymentAnnotations:
  secret.reloader.stakater.com/auto: "true"
podAnnotations:
  needu.gift/worker-bootstrap-revision: "serviceaccount-2026-11-12"
  prometheus.io/scrape: "true"
  prometheus.io/path: /actuator/prometheus
  prometheus.io/port: "8080"
env:
  - name: SPRING_PROFILES_ACTIVE
    value: prod,ai-worker
  - name: SPRING_DATASOURCE_URL
    value: jdbc:mysql://needu-prod-mysql.chmgo2a26a97.ap-northeast-2.rds.amazonaws.com:3306/needu
  - name: DB_USERNAME
    value: needu
  - name: SPRING_DATA_REDIS_HOST
    value: master.needu-prod-redis.s4gucc.apn2.cache.amazonaws.com
  - name: SPRING_DATA_REDIS_PORT
    value: "6379"
  - name: SPRING_DATA_REDIS_SSL_ENABLED
    value: "true"
  - name: SPRING_DATA_REDIS_CONNECT_TIMEOUT
    value: 10s
  - name: SPRING_DATA_REDIS_TIMEOUT
    value: 10s
  - name: STREAM_REDIS_HOST
    value: master.needu-v3-prod-valkey.s4gucc.apn2.cache.amazonaws.com
  - name: STREAM_REDIS_PORT
    value: "6379"
  - name: STREAM_REDIS_SSL_ENABLED
    value: "true"
  - name: STREAM_REDIS_CONNECT_TIMEOUT
    value: 10s
  - name: STREAM_REDIS_TIMEOUT
    value: 10s
  - name: AI_SERVER_BASE_URL
    value: http://ai-fastapi.backend.svc.cluster.local:8000
extraEnv:
  - name: SERVER_SHUTDOWN
    value: graceful
  - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
    value: 120s
  - name: AI_SERVICE_TOKEN
    valueFrom:
      secretKeyRef:
        name: ai-api-runtime
        key: AI_SERVICE_TOKEN
envFrom:
  - secretRef:
      name: backend-runtime
  - secretRef:
      name: backend-db
service:
  enabled: false
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
autoscaling:
  enabled: false
keda:
  enabled: true
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 3
  fallback:
    failureThreshold: 3
    replicas: 1
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Pods
              value: 2
              periodSeconds: 30
            - type: Percent
              value: 100
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 300
          selectPolicy: Max
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
  triggers:
    - type: redis-streams
      metadata:
        hostFromEnv: STREAM_REDIS_HOST
        portFromEnv: STREAM_REDIS_PORT
        stream: aichat:reply-jobs
        consumerGroup: aichat-reply-workers
        lagCount: "5"
        activationLagCount: "1"
        enableTLS: "true"
probes:
  startup:
    enabled: true
    path: /livez
  liveness:
    enabled: true
    path: /livez
  readiness:
    enabled: true
    path: /readyz
