progressDeadlineSeconds: 300
enabled: true
nameOverride: frontend
namespace: frontend
nodeSelector:
  pool: application
deploymentAnnotations:
  secret.reloader.stakater.com/auto: "true"
serviceAccount:
  name: frontend
image:
  repository: "919551759796.dkr.ecr.ap-northeast-2.amazonaws.com/need-u/frontend"
  digest: "sha256:e75e7e66313dfd1847ddedf065eba4d759d665532716e079565edc86f478e8bc"
  tag: "v2-2df18d6e4203ca2a5126418adc248d90b0a500f3"
env:
  - name: NODE_ENV
    value: production
  - name: BACKEND_API_BASE_URL
    value: https://v3.prod.needu.gift/api
  - name: BACKEND_AUTH_API_BASE_URL
    value: "http://auth-api.backend.svc.cluster.local:8080/"
  - name: BACKEND_RECOMMENDATION_API_BASE_URL
    value: "http://recommendation-api.backend.svc.cluster.local:8080/"
  - name: BACKEND_SOCIAL_API_BASE_URL
    value: "http://social-api.backend.svc.cluster.local:8080/"
envFrom:
  - secretRef:
      name: frontend-runtime
service:
  enabled: true
  port: 3000
  targetPort: 3000
containerPort: 3000
probes:
  liveness:
    enabled: true
    path: /api/health/live
  readiness:
    enabled: true
    path: /api/health/ready
