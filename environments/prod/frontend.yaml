progressDeadlineSeconds: 300
enabled: true
nameOverride: frontend
namespace: frontend
nodeSelector:
  pool: application
deploymentAnnotations:
  secret.reloader.stakater.com/auto: "true"
serviceAccount:
  name: frontend
image:
  repository: "919551759796.dkr.ecr.ap-northeast-2.amazonaws.com/need-u/frontend"
  digest: "sha256:9a3df32b46dad787c28cb3ec300185e49a50563fd09e431ef1aedf8db235f6eb"
  tag: "v2-ce2aca4cfa74a151b4076c745c9f455f97dbad27"
env:
  - name: NODE_ENV
    value: production
  - name: BACKEND_API_BASE_URL
    value: https://needu.gift/api
  - name: BACKEND_AUTH_API_BASE_URL
    value: "http://auth-api.backend.svc.cluster.local:8080/"
  - name: BACKEND_RECOMMENDATION_API_BASE_URL
    value: "http://recommendation-api.backend.svc.cluster.local:8080/"
  - name: BACKEND_SOCIAL_API_BASE_URL
    value: "http://social-api.backend.svc.cluster.local:8080/"
envFrom:
  - secretRef:
      name: frontend-runtime
service:
  enabled: true
  port: 3000
  targetPort: 3000
containerPort: 3000
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
probes:
  liveness:
    enabled: true
    path: /api/health/live
  readiness:
    enabled: true
    path: /api/health/ready
