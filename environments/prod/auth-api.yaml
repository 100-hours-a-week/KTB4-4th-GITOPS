progressDeadlineSeconds: 300
enabled: true
nameOverride: auth-api
namespace: backend
nodeSelector:
  pool: application
serviceAccount:
  name: auth-api
envFrom:
  - secretRef:
      name: backend-runtime
  - secretRef:
      name: backend-db
service:
  enabled: true
  port: 8080
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
probes:
  startup:
    enabled: true
    path: /livez
  liveness:
    enabled: true
    path: /livez
  readiness:
    enabled: true
    path: /readyz
