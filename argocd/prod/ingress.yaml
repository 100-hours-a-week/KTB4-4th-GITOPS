apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: needu-prod-ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-4th-GITOPS.git
    targetRevision: main
    path: kubernetes/prod/ingress
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
