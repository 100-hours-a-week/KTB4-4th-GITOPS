apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: needu-prod-alb-controller
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      targetRevision: 1.14.0
      helm:
        releaseName: aws-load-balancer-controller
        valueFiles:
          - $values/environments/prod/alb-controller.yaml

    - repoURL: https://github.com/100-hours-a-week/KTB4-4th-GITOPS.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
